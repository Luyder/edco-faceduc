<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Editor · Educación Continua</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

<header class="ed-cab">
  <img src="assets/logo-edco-negro.png" alt="Educación Continua" class="ed-logo">
  <div class="ed-titulo">Editor del sitio</div>
  <a class="ed-ver" href="index.html" target="_blank" rel="noopener">Ver sitio ↗</a>
</header>

<div class="ed-barra" id="barra">
  <span class="ed-estado" id="estado">Sin cambios</span>
  <span class="ed-modo" id="modo"></span>
  <button class="boton" id="sincronizar" title="Copia al sitio los cursos del portal de Educación Continua">↻ Actualizar desde el portal</button>
  <button class="boton" id="descartar" hidden>Descartar cambios</button>
  <button class="boton verde" id="conectar" hidden>🔑 Conectar con GitHub</button>
  <button class="boton negro" id="guardar">Publicar</button>
</div>

<main class="ed-main">
  <nav class="ed-tabs" role="tablist">
    <button role="tab" data-tab="cursos" aria-selected="true">Cursos</button>
    <button role="tab" data-tab="profes" aria-selected="false">Profesores</button>
    <button role="tab" data-tab="noticias" aria-selected="false">Noticias</button>
    <button role="tab" data-tab="github" aria-selected="false">Conexión con GitHub</button>
  </nav>

  <section class="ed-panel" id="tab-cursos">
    <div class="ed-dos">
      <aside class="ed-lista">
        <div class="ed-lista-cab">
          <input class="campo" id="filtro-cursos" type="search" placeholder="Buscar curso…" aria-label="Buscar curso">
          <button class="boton negro" id="nuevo-curso">+ Nuevo curso</button>
        </div>
        <ol id="lista-cursos"></ol>
      </aside>
      <div class="ed-form" id="form-curso"></div>
    </div>
  </section>

  <section class="ed-panel" id="tab-profes" hidden>
    <div class="ed-dos">
      <aside class="ed-lista">
        <div class="ed-lista-cab">
          <input class="campo" id="filtro-profes" type="search" placeholder="Buscar profesor…" aria-label="Buscar profesor">
          <button class="boton negro" id="nuevo-profe">+ Nuevo profesor</button>
        </div>
        <ol id="lista-profes"></ol>
      </aside>
      <div class="ed-form" id="form-profe"></div>
    </div>
  </section>

  <section class="ed-panel" id="tab-noticias" hidden>
    <div class="ed-dos">
      <aside class="ed-lista">
        <div class="ed-lista-cab">
          <input class="campo" id="filtro-noticias" type="search" placeholder="Buscar noticia…" aria-label="Buscar noticia">
          <button class="boton negro" id="nueva-noticia">+ Nueva noticia</button>
        </div>
        <ol id="lista-noticias"></ol>
      </aside>
      <div class="ed-form" id="form-noticia"></div>
    </div>
  </section>

  <section class="ed-panel" id="tab-github" hidden>
    <div class="ed-form ed-gh" id="form-github"></div>
  </section>
</main>

<div class="ed-toast" id="toast" role="status" hidden></div>

<dialog id="informe" class="ed-informe" aria-labelledby="informe-titulo"></dialog>

<script src="datos.js"></script>
<script src="formato-datos.js"></script>
<script src="admin.js"></script>
</body>
</html>
